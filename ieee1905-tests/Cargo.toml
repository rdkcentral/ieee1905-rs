[package]
name = "ieee1905-tests"
version = "0.6.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
# core library
ieee1905 = { path = "../ieee1905-core", features = ["topology_ui"] }

tokio  = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
tokio-util = "0.7.20"
futures = "0.3"
bytes = "1.12.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pnet = "0.35.0"

[features]
enable_tokio_console = ["ieee1905/enable_tokio_console"]

[[bin]]
name="functional_tests_transmitter"
path="src/functional_tests_transmitter.rs"

[[bin]]
name="functional_tests_receiver"
path="src/functional_tests_receiver.rs"

[[bin]]
name="ieee1905-test-node"
path="src/ieee1905-test-node.rs"
